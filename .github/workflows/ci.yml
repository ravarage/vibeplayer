# Compiles the app and runs the JVM unit tests on every push and pull request.
# The native libraries (native/build.sh) are not built here: compiling Kotlin and the unit tests do not
# need them. Building the APK and the device checks stay on the owner's machine.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK (platform 37.0, build-tools 37.0.0)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Compile and run unit tests
        run: ./gradlew --no-daemon :player:testDebugUnitTest :app:compileDebugKotlin :app:testDebugUnitTest

      - name: Tool tests (devcheck, bench)
        run: |
          python3 -m unittest discover tools/devcheck/tests
          python3 -m unittest discover -s tools/bench -p 'test_*.py'

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            player/build/reports/tests/
            app/build/reports/tests/
