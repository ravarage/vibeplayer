
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a45"></stop>
      <stop offset="1" stop-color="#030713"></stop>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39f5ef"></stop>
      <stop offset=".36" stop-color="#258cff"></stop>
      <stop offset=".68" stop-color="#a33cff"></stop>
      <stop offset="1" stop-color="#ff55bb"></stop>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe45b"></stop>
      <stop offset=".5" stop-color="#ff765c"></stop>
      <stop offset="1" stop-color="#ff35b9"></stop>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#087bff"></stop>
      <stop offset=".5" stop-color="#853cff"></stop>
      <stop offset="1" stop-color="#ff50cc"></stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".3"></stop>
      <stop offset="1" stop-color="#fff" stop-opacity="0"></stop>
    </linearGradient>
    <clipPath id="clip">
      <rect width="512" height="512" rx="112"></rect>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"></rect>

    <path d="M-20 280 Q65 205 145 290 T300 300 T540 245
             L540 400 Q430 340 350 405 T150 395 T-20 425Z" fill="#132d82" opacity=".65"></path>

    <path d="M-20 310 Q70 235 150 325 T315 325 T540 275" fill="none" stroke="url(#wave)" stroke-width="26" stroke-linecap="round" opacity=".9"></path>

    <path d="M-20 355 Q70 285 160 360 T330 370 T540 335" fill="none" stroke="#713dff" stroke-width="17" stroke-linecap="round" opacity=".65"></path>

    <path d="M-20 395 Q90 330 180 405 T365 410 T540 385" fill="none" stroke="#ff4ec8" stroke-width="7" stroke-linecap="round" opacity=".8"></path>

    <!-- Main play mark -->
    <path d="M190 122 Q176 114 176 139 L176 371
             Q176 397 199 383 L359 285
             Q383 270 359 256Z" fill="#05091c" opacity=".8"></path>

    <path d="M187 115 Q174 108 174 133 L174 365
             Q174 392 198 378 L357 280
             Q379 267 357 253Z" fill="url(#play)"></path>

    <!-- Warm inner ribbon -->
    <path d="M174 145 L174 365 Q174 392 198 378
             L244 350 Q279 326 262 287
             L201 139 Q187 108 174 133Z" fill="url(#warm)"></path>

    <!-- Cool upper ribbon -->
    <path d="M187 115 Q174 108 174 133
             Q174 159 198 173 L327 250
             Q356 267 370 246
             Q383 226 358 211Z" fill="url(#play)"></path>

    <!-- Subtle surface highlight -->
    <path d="M187 115 Q174 108 174 133
             Q174 159 198 173 L327 250
             Q356 267 370 246
             Q383 226 358 211Z" fill="url(#shine)"></path>

    <path d="M198 378 Q174 392 174 365
             Q174 344 202 326 L329 249
             Q357 233 370 252
             Q382 270 357 280Z" fill="#a83cff" opacity=".4"></path>
  </g>
</svg>
